name: keepalive

# خدمة Render المجانية تنام بعد 15 دقيقة بدون طلبات.
# هذا الـ ping كل 10 دقائق يبقيها مستيقظة، فالرد على رسائل تليجرام فوري
# بدل انتظار 50 ثانية لحين الاستيقاظ (cold start).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render so the free instance stays awake
        run: |
          curl -sS --max-time 60 -o /dev/null -w "render / -> %{http_code}\n" https://telegram-laptop-bot.onrender.com/
